[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    {[common]deps}
    # The packages it depends on come from this checkout rather than a
    # package index, so the tests run with the code they are released with.
    -e../fiftyone_devicedetection_shared/
    -e../../pipeline/fiftyone_pipeline_core/
    -e../../pipeline/fiftyone_pipeline_engines/
    -e../../pipeline/fiftyone_pipeline_engines_fiftyone/
    -e../../pipeline/fiftyone_pipeline_cloudrequestengine/
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_devicedetection_cloud {tty:--color=yes} {posargs}
# PYTEST_ADDOPTS carries the marker selection of ../ci/run-unit-tests.ps1,
# which leaves the live tests out of the unit step.
pass_env =
    _51DEGREES_RESOURCE_KEY
    _51DEGREES_RESOURCE_KEY_BESPOKE
    _51DEGREES_LICENSE_KEY
    PYTEST_ADDOPTS

[testenv:pre-publish]
package = skip
deps =
    {[common]deps}
    -r ../../../package/pre-publish-requirements.txt
