[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_devicedetection_examples {tty:--color=yes} {posargs}

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
allowlist_externals =
    pwsh
deps =
    {[common]deps}
    Cython
    setuptools
    -e../fiftyone_devicedetection/
    -e../fiftyone_devicedetection_cloud/
    -e../fiftyone_devicedetection_onpremise/
    -e../fiftyone_devicedetection_shared/
    # The pipeline packages come from this checkout rather than a package
    # index, so the tests run with the pipeline code they are released with.
    -e../../pipeline/fiftyone_pipeline_core/
    -e../../pipeline/fiftyone_pipeline_engines/
    -e../../pipeline/fiftyone_pipeline_engines_fiftyone/
    -e../../pipeline/fiftyone_pipeline_cloudrequestengine/
commands =
    pwsh -ExecutionPolicy Bypass -File ../ci/build-onpremise-c-module.ps1
    {[common]commands}
pass_env =
    _51DEGREES_RESOURCE_KEY
    resource_key
    _51DEGREES_RESOURCE_KEY_BESPOKE
    _51DEGREES_LICENSE_KEY
    license_key
    _51DEGREES_RUN_PERFORMANCE_TESTS
    run_performance_tests
    # A download the examples make in GitHub Actions leaves out their own
    # source name, and the data repository's script names the build from
    # these instead, so a test's download is not counted as a person
    # running the examples.
    GITHUB_ACTIONS
    GITHUB_REPOSITORY

[testenv:pre-publish]
deps =
    {[common]deps}
    -r ../../../package/pre-publish-requirements.txt
commands =
    {[common]commands}
