[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov
    # The web example is a Flask application, and the web integration in
    # fiftyone_pipeline_core, which it uses, imports Flask without the
    # package requiring it.
    flask

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    {[common]deps}
    # The packages it depends on come from this checkout rather than a
    # package index, so the tests run with the code they are released with.
    -e../pipeline/fiftyone_pipeline_core/
    -e../pipeline/fiftyone_pipeline_engines/
    -e../pipeline/fiftyone_pipeline_cloudrequestengine/
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_location {tty:--color=yes} {posargs}
pass_env =
    _51DEGREES_RESOURCE_KEY
    resource_key
    _51DEGREES_LICENSE_KEY
    license_key

# Tests the packages just built, so it takes the test tools from [common]
# and every package from the requirements file, never the editable copies
# above, which pip refuses beside a built copy of the same package.
[testenv:pre-publish]
package = skip
deps =
    {[common]deps}
    -r ../../package/pre-publish-requirements.txt
