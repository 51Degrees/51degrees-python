[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    {[common]deps}
    # The packages it depends on come from this checkout rather than a
    # package index, so the tests run with the code they are released with.
    -e../../pipeline/fiftyone_pipeline_core/
    -e../../pipeline/fiftyone_pipeline_engines/
    -e../../pipeline/fiftyone_pipeline_engines_fiftyone/
    -e../../pipeline/fiftyone_pipeline_cloudrequestengine/
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_ipintelligence_shared {tty:--color=yes} {posargs}
pass_env =
    resource_key
    license_key

[testenv:pre-publish]
package = skip
deps =
    {[common]deps}
    -r ../../../package/pre-publish-requirements.txt
