[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov
    flask
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_ipintelligence_onpremise {tty:--color=yes} {posargs}

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    {[common]deps}
    Cython
    setuptools
    # Only what the tests import. The shared package is required by this
    # package by name and is not on a package index, so it comes from the
    # working copy. The meta and examples packages were listed here too,
    # and they require this package by name, which forced an editable copy
    # of it in beside the wheel tox builds and made examples and on-premise
    # depend on each other.
    -e../fiftyone_ipintelligence_shared/
commands =
    python setup.py build_clib build_ext
    {[common]commands}
pass_env =
    resource_key
    license_key
    IPINTELLIGENCEDATAFILE
    TMPDIR
    TEMP
    TMP

[testenv:pre-publish]
package = skip
deps =
    {[common]deps}
    -r ../../../package/pre-publish-requirements.txt
