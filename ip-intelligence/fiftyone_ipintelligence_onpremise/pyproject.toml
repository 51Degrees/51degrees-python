[build-system]
requires = ["setuptools>=42", "wheel", "Cython"]
build-backend = "setuptools.build_meta"

# Every warning the test run raises is an error, as in the native build:
# Python's own (DeprecationWarning, ResourceWarning and the rest), pytest's,
# and those of the packages the tests use.
[tool.pytest.ini_options]
filterwarnings = ["error"]
