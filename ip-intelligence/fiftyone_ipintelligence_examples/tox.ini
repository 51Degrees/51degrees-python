[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov
    flask
    ruamel.yaml

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    {[common]deps}
    Cython
    setuptools
    -e../fiftyone_ipintelligence/
    -e../fiftyone_ipintelligence_cloud/
    -e../fiftyone_ipintelligence_shared/
    -e../fiftyone_ipintelligence_onpremise/
    # This package requires the translation package by name, and none of
    # these packages is on a package index yet, so it comes from the
    # working copy as the others do.
    -e../fiftyone_ipintelligence_translation/
    # The pipeline packages come from this checkout rather than a package
    # index, so the tests run with the pipeline code they are released with.
    -e../../pipeline/fiftyone_pipeline_core/
    -e../../pipeline/fiftyone_pipeline_engines/
    -e../../pipeline/fiftyone_pipeline_engines_fiftyone/
    -e../../pipeline/fiftyone_pipeline_cloudrequestengine/
    -e../../pipeline/fiftyone_pipeline_translation/
# --cov is needed even though coverage of the examples is not the point:
# common-ci's run-integration-tests.ps1 moves the .coverage file every
# package writes, and throws when there is none, after the tests pass.
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_ipintelligence_examples {tty:--color=yes} {posargs}
pass_env =
    _51DEGREES_RESOURCE_KEY
    _51DEGREES_RESOURCE_KEY_BESPOKE
    resource_key
    license_key
    IPINTELLIGENCEDATAFILE
    TMPDIR
    TEMP
    TMP

[testenv:pre-publish]
# The examples package itself must be installed, because its tests import
# fiftyone_ipintelligence_examples. The publish workflow does not build an
# examples distribution, so nothing else puts it in the environment, and
# 'package = skip' left every pre-publish run failing to collect its tests.
deps =
    {[common]deps}
    -r ../../../package/pre-publish-requirements.txt
