[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
# tox runs the tests in a clean environment and strips anything it is not
# told to keep, so without this the live cloud tests never see the resource
# key and fail on every run. PYTEST_ADDOPTS carries the markers the CI
# scripts select with.
passenv =
    _51DEGREES_RESOURCE_KEY
    _51DEGREES_RESOURCE_KEY_BESPOKE
    _51DEGREES_RESOURCE_KEY_BASIC
    _51DEGREES_LICENSE_KEY
    _51DEGREES_CLOUD_ENDPOINT
    PYTEST_ADDOPTS
deps =
    {[common]deps}
    # owid is provided by the owid-python submodule (../owid-python), not
    # PyPI. Installing it editable satisfies this package's owid requirement.
    -e../owid-python/
commands =
    pytest --cov=fiftyone_pipeline_did {tty:--color=yes} {posargs}

[testenv:pre-publish]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    {[common]deps}
    -e../owid-python/
commands =
    pytest --cov=fiftyone_pipeline_did {tty:--color=yes} {posargs}
