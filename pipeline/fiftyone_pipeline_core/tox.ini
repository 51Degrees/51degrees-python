[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov
    parameterized
    requests_mock
    flask

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
# The engines package requires this package at the version this checkout
# releases, which a package index may not have yet, so this package is taken
# from the checkout too. The built wheel replaces it before the tests run.
deps =
    {[common]deps}
    -e../fiftyone_pipeline_cloudrequestengine/
    -e../fiftyone_pipeline_core/
    -e../fiftyone_pipeline_engines/
    -e../fiftyone_pipeline_engines_fiftyone/
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_pipeline_core {tty:--color=yes} {posargs}
pass_env =
    # Every variable the tests read starts _51DEGREES_.
    _51DEGREES_*

[testenv:pre-publish]
package = skip
deps =
    {[common]deps}
    -r ../../../package/pre-publish-requirements.txt
