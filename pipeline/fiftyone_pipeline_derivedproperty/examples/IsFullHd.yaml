# A derived property script for the derived property example, which reads
# it from this file. The file name without .yaml must equal the script's
# Name. The format is described in
# https://github.com/51Degrees/derived-properties/blob/main/docs/format-1.md

Format: 1
Name: IsFullHd
Version: 1.0.0
Output:
  Name: IsFullHd
  Description: >-
    Whether the screen is at least 1920 pixels wide and 1080 pixels high,
    the size of a full HD picture.
  ValueType: bool
  IsList: false
  Category: Example

# Rules are read in order, and the first whose When is true gives the
# value. Every script ends with an Else, which gives the value when no
# other rule does.
Rules:
  - When:
      All:
        - { Property: screen.Width, Ge: 1920 }
        - { Property: screen.Height, Ge: 1080 }
    Then: true
  - Else: false
