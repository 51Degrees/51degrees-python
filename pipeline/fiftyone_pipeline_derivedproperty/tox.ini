[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    {[common]deps}
    -e../fiftyone_pipeline_core/
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_pipeline_derivedproperty {tty:--color=yes} {posargs}

# The package is not published, so Publish has built no copy of it to test.
# Its tests then run as they do in every build, on a wheel built here.
[testenv:pre-publish]
