[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov

# ci/run-integration-tests.ps1 runs these environments through common-ci
# and says why the examples are listed there.
#
# The "py" environment tests the examples against the packages in this
# checkout, installed editable, as the build and test jobs do. The
# "pre-publish" environment tests them against the packages just built, as
# the test job before a publish does, by reading the requirements file that
# common-ci writes with the paths of the built packages. Both build and
# install the examples themselves, which are never published, so the
# coverage path below is the installed copy in either, and flask arrives as
# a dependency of the examples rather than being listed above.
[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    {[common]deps}
    -e../../fiftyone_pipeline_core/
    -e../../fiftyone_pipeline_engines/
    -e../
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_pipeline_examples {tty:--color=yes} {posargs}
# tox runs the tests in a clean environment and strips anything it is not
# told to keep, so without this the cloud tests never see a key and fail on
# every run. Every name the examples document, the Examples workflow sets and
# tests/live_cloud.py reads starts with _51DEGREES_. The last two are for a
# cloud service other than the public one, the endpoint being read by both the
# examples and the cloud request engine underneath them, and the origin by the
# examples for a resource key limited to particular domains.
pass_env =
    _51DEGREES_RESOURCE_KEY
    _51DEGREES_RESOURCE_KEY_BESPOKE
    _51DEGREES_LICENSE_KEY
    _51DEGREES_CLOUD_ENDPOINT
    _51DEGREES_CLOUD_REQUEST_ORIGIN

[testenv:pre-publish]
deps =
    {[common]deps}
    -r ../../../../package/pre-publish-requirements.txt
