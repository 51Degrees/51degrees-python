[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov
    parameterized

[testenv]
description = run the tests with pytest
package = sdist
wheel_build_env = .pkg
deps =
    {[common]deps}
    -e../fiftyone_pipeline_core/
    -e../fiftyone_pipeline_engines/
    -e../fiftyone_pipeline_engines_fiftyone/
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_pipeline_cloudrequestengine {tty:--color=yes} {posargs}
pass_env =
    _51DEGREES_RESOURCE_KEY
    resource_key
    _51DEGREES_LICENSE_KEY
    license_key
    # The marker selection of ../ci/run-integration-tests.ps1, which leaves
    # the live tests out when no resource key is passed.
    PYTEST_ADDOPTS

[testenv:pre-publish]
package = skip
deps =
    {[common]deps}
    -r ../../../package/pre-publish-requirements.txt
