[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
# The Cloud Request Engine requires this package at the version this checkout
# releases, which a package index may not have yet, so this package is taken
# from the checkout too. The built wheel replaces it before the tests run.
deps =
    {[common]deps}
    -e../fiftyone_pipeline_cloudrequestengine/
    -e../fiftyone_pipeline_core/
    -e../fiftyone_pipeline_engines/
    -e../fiftyone_pipeline_engines_fiftyone/
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_pipeline_engines {tty:--color=yes} {posargs}
pass_env =
    _51DEGREES_RESOURCE_KEY
    _51DEGREES_LICENSE_KEY

[testenv:pre-publish]
package = skip
deps =
    {[common]deps}
    -r ../../../package/pre-publish-requirements.txt
