name: Temporary usage sharing tests

on:
  push:
    branches:
      - 'tmp/u97-**'

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        run: git submodule update --init pipeline/fiftyone_pipeline_core/src/fiftyone_pipeline_core/js_templates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          cd pipeline
          pip install pytest flask
          pip install -e fiftyone_pipeline_core -e fiftyone_pipeline_engines -e fiftyone_pipeline_cloudrequestengine -e fiftyone_pipeline_engines_fiftyone
      - name: Test
        run: |
          cd pipeline/fiftyone_pipeline_engines_fiftyone
          python -m pytest -p no:cacheprovider -v tests/test_usage.py tests/test_share_usage_backoff.py tests/test_share_usage_tracker.py
