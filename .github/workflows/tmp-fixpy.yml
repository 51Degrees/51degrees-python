name: Temporary fix tests

on:
  push:
    branches:
      - 'tmp/fixpy-*'

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submodules the pure Python packages need
        run: >
          git submodule update --init --depth 1
          pipeline/fiftyone_pipeline_core/src/fiftyone_pipeline_core/js_templates
          pipeline/owid-python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: >
          pip install pytest parameterized requests_mock flask
          -e pipeline/fiftyone_pipeline_core
          -e pipeline/fiftyone_pipeline_engines
          -e pipeline/fiftyone_pipeline_cloudrequestengine
          -e pipeline/fiftyone_pipeline_engines_fiftyone
      - name: Listed tests
        if: always()
        env:
          PYTHONPATH: ip-intelligence/fiftyone_ipintelligence_onpremise/src:device-detection/fiftyone_devicedetection_onpremise/src
        run: |
          status=0
          for t in $(cat tmp-tests.txt); do
            python -m pytest "$t" -v -m "not live" || status=1
          done
          exit $status
      - name: Core tests
        if: always()
        run: python -m pytest pipeline/fiftyone_pipeline_core/tests -q -m "not live"
