name: Temporary web integration element tests

on:
  push:
    branches:
      - 'tmp/py70-**'

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        run: git submodule update --init pipeline/fiftyone_pipeline_core/src/fiftyone_pipeline_core/js_templates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          cd pipeline
          pip install pytest flask parameterized requests_mock
          pip install -e fiftyone_pipeline_core -e fiftyone_pipeline_engines -e fiftyone_pipeline_cloudrequestengine -e fiftyone_pipeline_engines_fiftyone
      - name: Web integration element tests
        run: |
          cd pipeline/fiftyone_pipeline_core
          python -m pytest -p no:cacheprovider -v tests/test_web_integration_elements.py
      - name: Core tests
        if: ${{ always() }}
        run: |
          cd pipeline/fiftyone_pipeline_core
          python -m pytest -p no:cacheprovider -q tests
      - name: Usage sharing tests
        if: ${{ always() }}
        run: |
          cd pipeline
          python -m pytest -p no:cacheprovider -q fiftyone_pipeline_engines_fiftyone/tests
