name: Method match metric check (throwaway)

on:
  push:
    branches:
      - 'tmp/ipnp-method-**'

permissions:
  contents: read

jobs:
  test:
    name: On-premise Device Detection tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the submodules and the C library's data submodule
        run: |
          git submodule update --init --depth 1
          git -C cxx submodule update --init --depth 1 data
      - name: Download the free Lite data file and the User-Agents the tests read
        run: |
          sh cxx/data/get-data-files.sh 51Degrees-LiteV4.1.hash "20000 User Agents.csv"
          ls -laL cxx/data/device-detection/51Degrees-LiteV4.1.hash "cxx/data/device-detection/20000 User Agents.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Give each package a version, as ci/write-package-versions.ps1 does
        run: |
          for f in $(git ls-files '*/setup.py'); do
            d=$(dirname "$f")
            [ -f "$d/version.txt" ] || echo 4.5.999 > "$d/version.txt"
          done
      - name: Install tox
        run: python -m pip install tox
      - name: Run the Method test beside the other basic tests
        working-directory: device-detection/fiftyone_devicedetection_onpremise
        run: tox -e py -- tests/test_devicedetection.py -k "method or basic_get or no_evidence"
