name: Environment variable names

on:
  pull_request:
  push:
    branches:
      - main
      - rc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-variable-names:
    name: No tracked file names a variable starting with a digit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the names
        shell: pwsh
        run: ./ci/check-environment-variable-names.ps1
