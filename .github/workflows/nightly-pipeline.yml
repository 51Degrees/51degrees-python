name: Nightly Pipeline

# No schedule yet. Until the four repositories this one replaces are frozen,
# they still publish the same packages, and two repositories must never
# publish the same package. The schedule is added in the cut-over, after their
# nightly workflows are disabled.
on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      skip-lite-tests:
        description: 'Skip testing with Lite data file'
        type: boolean
        default: false
      common-ci-ref:
        type: string
        default: ''

jobs:
  SubmoduleUpdate:
    name: Nightly Submodule Update
    uses: 51Degrees/common-ci/.github/workflows/nightly-submodule-update.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}

  PullRequests:
    if: ${{ !cancelled() }}
    needs: SubmoduleUpdate
    name: Nightly Pull Requests
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-requests.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
      skip-lite-tests: ${{ inputs.skip-lite-tests || false }}
      cache-assets: true
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
      CsvUrl: ${{ secrets.CSV_URL }}
      IpIntelligence: ${{ secrets.IP_INTELLIGENCE_KEY }}
      IpIntelligenceUrl: ${{ secrets.IPI_DATA_FILE_URL }}
      TestResourceKey: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}

  Publish:
    if: ${{ !cancelled() }}
    needs: PullRequests
    name: Nightly Publish
    uses: 51Degrees/common-ci/.github/workflows/nightly-publish.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
      cache-assets: true
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
      CsvUrl: ${{ secrets.CSV_URL }}
      IpIntelligence: ${{ secrets.IP_INTELLIGENCE_KEY }}
      IpIntelligenceUrl: ${{ secrets.IPI_DATA_FILE_URL }}
      TestResourceKey: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
      PypiToken: ${{ secrets.PYPI_TOKEN }}
      TestPypiToken: ${{ secrets.TEST_PYPI_TOKEN }}
