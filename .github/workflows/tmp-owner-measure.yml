name: Temporary Python measurement runs
on:
  push:
    branches: ['tmp/pyowner-test-measure-*']
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/activate ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          python -m pip install -q pytest pytest-cov -e pipeline/fiftyone_pipeline_core
      - name: Measure five times, plain and with coverage as tox runs it
        working-directory: pipeline/fiftyone_pipeline_core
        run: |
          if [ -f ../../.venv/Scripts/activate ]; then . ../../.venv/Scripts/activate; else . ../../.venv/bin/activate; fi
          for i in 1 2 3 4 5; do
            python -m pytest tests/test_javascriptbuilder_minify_performance.py -q -s -p no:cacheprovider | grep -E "Minifying added|passed|failed" | sed 's/^/plain /'
          done
          for i in 1 2 3 4 5; do
            python -m pytest --cov=fiftyone_pipeline_core tests/test_javascriptbuilder_minify_performance.py -q -s -p no:cacheprovider | grep -E "Minifying added|passed|failed" | sed 's/^/coverage /'
          done
