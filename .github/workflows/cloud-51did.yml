name: Cloud 51Did Tests

# Runs the live cloud 51Did integration test
# (pipeline/fiftyone_pipeline_did/tests/test_did_client_live.py) once for
# every _51DEGREES_RESOURCE_KEY* key passed to its step below. Each run sets
# the single _51DEGREES_RESOURCE_KEY the test reads first. Those keys carry
# the FODid product and the CloudV5FODiD product the marketing usages need.
# The Basic key carries FODid without CloudV5FODiD, so it runs only the
# tests of what the Basic tier is entitled to (test_did_tier_live.py).
#
# The secrets are named one by one rather than passed as toJSON(secrets).
# GitHub marks a workflow that hands every secret to a step as possibly
# malicious and holds each run for manual approval, so the nightly never ran.
# A new resource key therefore needs a line here as well as the organisation
# secret.
#
# A run with no key fails, because a cloud test that passes without calling
# the cloud has proved nothing. A pull request from a fork gets no secrets,
# so run this workflow from a branch in this repository.

on:
  workflow_dispatch:
  # Nightly as well, because a pull_request run only ever checks the package
  # against the cloud as it stood that day. A released package is not checked
  # again, so a field the cloud starts writing, stops writing or changes goes
  # unnoticed until a customer finds it. That is what happened when the cloud service began
  # writing the Terms byte. The six 51Did packages are
  # staggered ten minutes apart so they do not all ask production at once.
  schedule:
    - cron: '30 5 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'pipeline/fiftyone_pipeline_did/**'
      - 'pipeline/owid-python/**'
      - '.github/workflows/cloud-51did.yml'

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/fiftyone_pipeline_did
    steps:
      - uses: actions/checkout@v4
        with:
          # tox installs owid from the owid-python submodule rather than PyPI.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Copy the OWID source into the package
        # setup.py declares fiftyone_pipeline_did._owid as a package, and it
        # is copied out of the owid-python submodule rather than committed,
        # so without this the wheel build fails with "package directory
        # 'src/fiftyone_pipeline_did/_owid' does not exist" before any test
        # runs.
        shell: pwsh
        working-directory: .
        run: ./pipeline/ci/copy-owid-source.ps1
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Cloud 51Did test for each resource key secret
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY_BESPOKE: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
          _51DEGREES_RESOURCE_KEY_51DID: ${{ vars._51DEGREES_RESOURCE_KEY_51DID }}
          # The redemption tests check a sealed result reads back only with a
          # license key, and the service only opens a sealed result for a
          # license key of the account whose resource key sealed it. So each
          # license key is passed only with the resource key of the same
          # suffix, and a resource key without one checks that the result
          # redeems as unreadable.
          _51DEGREES_LICENSE_KEY_51DID: ${{ secrets._51DEGREES_LICENSE_KEY_51DID }}
        run: |
          $keys = Get-ChildItem env: |
            Where-Object { $_.Name -like '_51DEGREES_RESOURCE_KEY*' -and $_.Value }
          if (-not $keys) {
            Write-Host '::error::No _51DEGREES_RESOURCE_KEY* secret reached this job. The tests need a key that carries the FODid product, and the CloudV5FODiD product for the marketing usages.'
            exit 1
          }
          $failed = $false
          foreach ($k in $keys) {
            Write-Host "::group::test_did_client_live with $($k.Name)"
            $env:_51DEGREES_RESOURCE_KEY = $k.Value
            $licenseName = $k.Name -replace '^_51DEGREES_RESOURCE_KEY', '_51DEGREES_LICENSE_KEY'
            $env:_51DEGREES_LICENSE_KEY = [Environment]::GetEnvironmentVariable($licenseName)
            Write-Host "License key: $(if ($env:_51DEGREES_LICENSE_KEY) { $licenseName } else { 'none' })"
            # -rs lists any test that skipped, and none should.
            tox -- tests/test_did_client_live.py -v -rs
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }
      - name: Cloud 51Did tier test with the Basic key
        if: ${{ !cancelled() }}
        env:
          _51DEGREES_RESOURCE_KEY_BASIC: ${{ vars._51DEGREES_RESOURCE_KEY_BASIC }}
        run: tox -- tests/test_did_tier_live.py -v -rs
