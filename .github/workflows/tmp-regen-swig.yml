name: Temporary SWIG wrapper generation

# Temporary. Generates both SWIG wrappers for the move of cxx to 4.5.102,
# commits them to this branch, and is then deleted from the branch.

on:
  push:
    branches:
      - 'feature/cxx-4.5.102'

permissions:
  contents: write

env:
  SWIG_TAG: v4.4.1
  SWIG_COMMIT: c7b01379fa00ff152bc22d4dd0e0d5bb862282d9
  CXX_OLD: 4110d6813e167a803a06489318b33b83a230fa32
  CXX_NEW: 1bec7b570575e2e180b52435599bef9b03e35ad8
  DD: device-detection/fiftyone_devicedetection_onpremise
  IPI: ip-intelligence/fiftyone_ipintelligence_onpremise

defaults:
  run:
    shell: bash

jobs:
  Generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check the starting point
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
          test "$(git -C cxx rev-parse HEAD)" = "$CXX_OLD"

      - name: Build SWIG from its tag
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison libpcre2-dev
          git clone --depth 1 --branch "$SWIG_TAG" \
            https://github.com/swig/swig.git "$RUNNER_TEMP/swig-src"
          test "$(git -C "$RUNNER_TEMP/swig-src" rev-parse HEAD)" = "$SWIG_COMMIT"
          cd "$RUNNER_TEMP/swig-src"
          ./autogen.sh
          ./configure --prefix="$RUNNER_TEMP/swig"
          make -j"$(nproc)"
          make install
          echo "SWIG_BIN=$RUNNER_TEMP/swig/bin/swig" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/artifact"
          "$RUNNER_TEMP/swig/bin/swig" -version \
            | tee "$RUNNER_TEMP/artifact/swig-version.txt"

      - name: Write the generation script
        run: |
          set -euo pipefail
          # generate <package folder> <interface> <wrapper> <cxx folder> <out>
          # Stages common and the product's folder of cxx/src beside the
          # interface, as setup.py does, runs SWIG there and copies the
          # wrapper and the Python module to <out>.
          cat > "$RUNNER_TEMP/generate.sh" <<'SCRIPT'
          set -euo pipefail
          src="$1/src/$(basename "$1")"
          interface=$2
          wrapper=$3
          product=$4
          out=$5
          work="$RUNNER_TEMP/work-$(basename "$1")"
          rm -rf "$work"
          cp -R "$GITHUB_WORKSPACE/$src" "$work"
          rm -rf "$work/cxx"
          mkdir -p "$work/cxx/src"
          cp -R "$GITHUB_WORKSPACE/cxx/src/common" "$work/cxx/src/common"
          cp -R "$GITHUB_WORKSPACE/cxx/src/$product" "$work/cxx/src/$product"
          module=$(grep -h '^%module' "$work/cxx/src/$product"/*.i \
            "$work/cxx/src/$product"/*/*.i 2>/dev/null | head -1 \
            | sed 's/%module *"\{0,1\}\([A-Za-z]*\).*/\1/')
          cd "$work"
          set -x
          "$SWIG_BIN" -c++ -python -outdir . -o "$wrapper" "$interface"
          set +x
          mkdir -p "$out"
          cp "$wrapper" "$module.py" "$out/"
          echo "$module" > "$out/module.txt"
          SCRIPT
          chmod +x "$RUNNER_TEMP/generate.sh"

      - name: Generate at 4110d681 and compare with the committed files
        id: old
        run: |
          set -euo pipefail
          identical=true
          for spec in "$DD hash_python.i hash_python_wrap.cxx dd" \
                      "$IPI ipi_python.i ipi_python_wrap.cxx ipi"; do
            set -- $spec
            out="$RUNNER_TEMP/artifact/old-$(basename "$1")"
            bash "$RUNNER_TEMP/generate.sh" "$1" "$2" "$3" "$4" "$out"
            module=$(cat "$out/module.txt")
            src="$1/src/$(basename "$1")"
            for f in "$3" "$module.py"; do
              if cmp "$src/$f" "$out/$f"; then
                echo "$f at 4110d681 is byte for byte the committed file."
              else
                identical=false
                diff "$src/$f" "$out/$f" > "$out/$f.diff" || true
                echo "$f at 4110d681 differs from the committed file:"
                head -60 "$out/$f.diff"
              fi
            done
          done
          echo "identical=$identical" >> "$GITHUB_OUTPUT"

      - name: Move cxx to 1bec7b57 and generate in place
        if: steps.old.outputs.identical == 'true'
        run: |
          set -euo pipefail
          git -C cxx fetch --depth 1 origin "$CXX_NEW"
          git -C cxx checkout --detach "$CXX_NEW"
          test "$(git -C cxx rev-parse HEAD)" = "$CXX_NEW"
          for spec in "$DD hash_python.i hash_python_wrap.cxx dd" \
                      "$IPI ipi_python.i ipi_python_wrap.cxx ipi"; do
            set -- $spec
            out="$RUNNER_TEMP/artifact/new-$(basename "$1")"
            bash "$RUNNER_TEMP/generate.sh" "$1" "$2" "$3" "$4" "$out"
            module=$(cat "$out/module.txt")
            cp "$out/$3" "$out/$module.py" "$1/src/$(basename "$1")/"
          done
          git status --porcelain --untracked-files=all \
            | tee "$RUNNER_TEMP/artifact/status-new.txt"
          git diff --stat

      - name: Upload the outputs and the diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swig-wrappers
          path: ${{ runner.temp }}/artifact
          if-no-files-found: warn

      - name: Stop unless the 4110d681 outputs are the committed files
        if: steps.old.outputs.identical != 'true'
        run: |
          echo "The command does not reproduce the committed wrappers."
          echo "Nothing is committed."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build both packages against 1bec7b57 and load the modules
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          for pkg in "$DD" "$IPI"; do
            python -m pip wheel --no-deps -w "$RUNNER_TEMP/dist" "./$pkg"
          done
          python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib
          for name, cls in (
                  ('fiftyone_devicedetection_onpremise.DeviceDetectionHashEngineModule',
                   'EngineHashSwig'),
                  ('fiftyone_ipintelligence_onpremise.IpIntelligenceEngineModule',
                   'EngineIpiSwig')):
              module = importlib.import_module(name)
              assert hasattr(getattr(module, cls), 'process'), (name, cls)
              print(name, 'loads, and', cls, 'has process')
          PY
          # The build stages cxx/src inside each package, which git ignores.
          git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all

      - name: Commit the pointer and the wrappers, and push
        env:
          GIT_AUTHOR_NAME: James Rosewell
          GIT_AUTHOR_EMAIL: james@51degrees.com
          GIT_COMMITTER_NAME: James Rosewell
          GIT_COMMITTER_EMAIL: james@51degrees.com
        run: |
          set -euo pipefail
          git add cxx "$DD/src" "$IPI/src"
          left="$(git status --porcelain --untracked-files=all \
            | grep -v -E '^M  cxx$' \
            | grep -v -E '^M  (device-detection|ip-intelligence)/[^ ]+_onpremise/src/[^ ]+_onpremise/[A-Za-z_]+(\.py|_wrap\.cxx)$' \
            || true)"
          if [ -n "$left" ]; then
            echo "Changes other than the pointer and the wrappers:"
            echo "$left"
            exit 1
          fi
          git diff --cached --stat
          cat > "$RUNNER_TEMP/message.txt" <<'MSG'
          Generate both SWIG wrappers again for 51degrees-cxx 4.5.102

          Between 4.5.100 and 4.5.102, 51degrees-cxx removed the two
          EngineHash process overloads and the three EngineIpi process
          overloads that take required property indexes. The committed
          wrappers still called them, so neither on-premise package compiled
          against 4.5.102, which the nightly submodule update brings in #26.

          This moves the cxx submodule from 4110d681, the 4.5.100 release, to
          1bec7b57, the 4.5.102 release, and generates hash_python_wrap.cxx,
          DeviceDetectionHashEngineModule.py, ipi_python_wrap.cxx and
          IpIntelligenceEngineModule.py again with SWIG 4.4.1 built from its
          v4.4.1 tag. Run against 4110d681, the same command gives files byte
          for byte the same as the ones committed before, so every difference
          here comes from cxx. Both engines call only process(evidence), which
          cxx keeps.
          MSG
          git commit -F "$RUNNER_TEMP/message.txt"
          git log -1 --format='commit %H%nauthor %an <%ae>%n%n%B'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
