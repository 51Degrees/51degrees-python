name: Temporary CO-6 on-premise test runs
on:
  push:
    branches: ['tmp/pyowner-test-co6o-*']
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Data files
        shell: pwsh
        run: |
          $names = '51Degrees-LiteV4.1.hash', '51Degrees-LiteV41.ipi'
          if (Test-Path tmp-du5-suites.txt) {
            $names += '20000 User Agents.csv', '51Degrees-IPIV4AsnIpiV41.ipi'
          }
          ./cxx/data/get-data-files.ps1 @names
          New-Item -ItemType Directory -Force ip-intelligence/assets | Out-Null
          Copy-Item cxx/data/ip-intelligence/51Degrees-LiteV41.ipi ip-intelligence/assets/51Degrees-LiteIpiV41.ipi
          Get-ChildItem cxx/data/device-detection, cxx/data/ip-intelligence, ip-intelligence/assets -File | Format-Table Name, Length
      - name: Install
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=python; mkdir -p /c/tmp; export TEMP='C:\tmp' TMP='C:\tmp'
          else
            PY=python3
          fi
          $PY --version
          $PY -m venv .venv
          if [ -f .venv/Scripts/activate ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          python -m pip install -q --upgrade pip
          python -m pip install -q pytest parameterized requests_mock flask -e pipeline/fiftyone_pipeline_core -e pipeline/fiftyone_pipeline_engines -e pipeline/fiftyone_pipeline_cloudrequestengine -e pipeline/fiftyone_pipeline_engines_fiftyone -e device-detection/fiftyone_devicedetection_shared -e ip-intelligence/fiftyone_ipintelligence_shared
          python -m pip install -q --no-deps -e device-detection/fiftyone_devicedetection_examples
          python -m pip install --no-deps ./device-detection/fiftyone_devicedetection_onpremise ./ip-intelligence/fiftyone_ipintelligence_onpremise
          python -m pip list | grep -i fiftyone
      - name: New tests
        run: |
          if [ -f .venv/Scripts/activate ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          status=0
          for d in pipeline/fiftyone_pipeline_engines device-detection/fiftyone_devicedetection_onpremise ip-intelligence/fiftyone_ipintelligence_onpremise; do
            (cd $d && python -m pytest tests/test_engine_in_pipelines.py -v -rA --durations=0) || status=1
          done
          exit $status
      - name: Suites
        if: always() && hashFiles('tmp-du5-suites.txt') != ''
        run: |
          if [ -f .venv/Scripts/activate ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          status=0
          for d in $(cat tmp-du5-suites.txt | tr -d '\r'); do
            (cd $d && python -m pytest tests -q -rfEs -m "not live") || status=1
          done
          exit $status
